<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Buttons</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="button-grid">
      <div class="brand">
        <h4>Amazon</h4>
        <button class="btn btn-lg amazon">Copy css</button>
        <button class="btn btn-sm amazon">Copy css</button>
        <button class="btn btn-sm btn-outline">Copy css</button>
      </div>

      <div class="brand">
        <h4>Techcrunch</h4>
        <button class="btn btn-xl techcrunch">Copy css</button>
        <button class="btn btn-xl tech btn-outline">Copy css</button>
      </div>

      <div class="brand">
        <h4>Producthunt</h4>
        <button class="btn btn-normal producthunt">Copy css</button>
        <button class="btn btn-normal product btn-outline">Copy css</button>
      </div>

      <div class="brand">
        <h4>Indie hackers</h4>
        <button class="btn btn-xl indie">Copy css</button>
        <button class="btn btn-normal indie">Copy css</button>
      </div>

      <div class="brand">
        <h4>Buy me a coffee</h4>
        <button class="btn btn-lg coffee">Copy css</button>
        <button class="btn btn-normal coffee-white">Copy css</button>
        <button class="btn btn-sm coffee-white">Copy css</button>
      </div>

      <div class="brand">
        <h4>HEY</h4>
        <button class="btn btn-lg hey">Copy css</button>
      </div>

      <div class="brand">
        <h4>Slack</h4>
        <button class="btn btn-normal slack">Copy css</button>
        <button class="btn sl btn-normal btn-outline">Copy css</button>
        <button class="btn sl btn-normal slack-white">Copy css</button>
      </div>

      <div class="brand">
        <h4>RemoteOK</h4>
        <button class="btn btn-normal remoteok">Copy css</button>
        <button class="btn btn-normal remo btn-outline">Copy css</button>
      </div>
    </div>
  </body>
</html>
