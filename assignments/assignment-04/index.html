<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Assignment 04 - Fetch API & DOM</title>

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="./assets/images/logo.png"
            type="image/svg+xml"
        />

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="./assets/css/styles.css" />
    </head>
    <body class="bg-amber-50">
        <!-- Header -->
        <header class="container mx-auto">
            <nav class="py-4">
                <div class="flex items-center justify-center">
                    <a href="/">
                        <img
                            class="max-w-32"
                            src="./assets/images/logo.png"
                            alt="Logo"
                        />
                    </a>
                </div>
            </nav>
        </header>

        <!-- Hero -->
        <section class="container mx-auto">
            <div class="bg-image py-32 relative">
                <div
                    class="absolute left-0 top-0 w-full h-full bg-white/20 flex flex-col items-center justify-center text-center"
                >
                    <h1 class="text-2xl text-white font-bold mb-3">
                        Search Your <br />
                        Favorite Recipe
                    </h1>
                    <p class="text-sm text-white font-light">
                        A handfull of simple ingredients typify the fresh
                        vibrant <br />
                        flavors of Greek cooking
                    </p>
                </div>
            </div>
        </section>

        <!-- Search -->
        <section class="container mx-auto">
            <form
                id="search-form"
                class="group pt-2.5 pb-5 flex items-center justify-center"
            >
                <input
                    class="w-1/2 h-10 p-2 border-2 border-primary group-hover:border-hover transition duration-300 rounded outline-none"
                    type="text"
                    name="search"
                    id="search-query"
                />
                <button
                    type="submit"
                    class="p-2 bg-primary rounded -ml-0.5 cursor-pointer group-hover:bg-hover transition duration-300"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </section>

        <!-- Recipes -->
        <section class="container mx-auto px-6 sm:px-16 min-h-screen pb-5">
            <h2 class="text-3xl text-center mb-2.5">latest Recipes</h2>
            <div
                id="recipes"
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5"
            >
                <div
                    class="col-span-full flex justify-center items-center py-20"
                >
                    <div role="status">
                        <svg
                            aria-hidden="true"
                            class="inline w-12 h-12 text-gray-200 animate-spin fill-primary"
                            viewBox="0 0 100 101"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                                fill="currentColor"
                            />
                            <path
                                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                                fill="currentFill"
                            />
                        </svg>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer
            class="mt-5 p-4 bg-gray-800 text-white container mx-auto flex flex-col sm:flex-row justify-between items-center"
        >
            <p>
                Copyright &copy; <span class="year"></span> - All rights
                reserved
            </p>
            <div class="flex gap-2.5">
                <a href="#" target="_blank" rel="noopener noreferrer"
                    ><i
                        class="fa-brands fa-twitter hover:text-primary transition-colors duration-300"
                    ></i
                ></a>

                <a href="#" target="_blank" rel="noopener noreferrer"
                    ><i
                        class="fa-brands fa-youtube hover:text-primary transition-colors duration-300"
                    ></i
                ></a>

                <a href="#" target="_blank" rel="noopener noreferrer"
                    ><i
                        class="fa-brands fa-facebook-f hover:text-primary transition-colors duration-300"
                    ></i
                ></a>
            </div>
        </footer>

        <!-- Back to top -->
        <div
            id="progress-btn"
            class="fixed bottom-16 right-8 w-16 h-16 rounded-full cursor-pointer flex items-center justify-center z-50 border-2 border-primary opacity-0 invisible translate-y-8 transition-all duration-300 ease-in-out animate-bounce gradient-conic"
        >
            <a
                href="#"
                class="back-to-top w-12 h-12 rounded-full bg-white flex flex-col items-center justify-center"
            >
                <i
                    class="fas fa-angle-double-right text-xl font-bold text-hover -rotate-90"
                ></i>
                <span id="percent-text" class="text-sm text-black block"></span>
            </a>
        </div>

        <!-- Modal -->
        <div
            id="recipe-modal"
            class="fixed inset-0 z-50 hidden justify-center items-center bg-black/50 opacity-0 transition-opacity duration-300 ease-in-out"
        >
            <div
                class="bg-white p-8 rounded-lg shadow-xl relative w-11/12 md:w-1/2 h-3/4 flex flex-col items-center"
            >
                <button
                    onclick="closeModal()"
                    class="absolute top-4 right-4 text-2xl text-primary hover:text-hover transition-colors cursor-pointer"
                >
                    <i class="fa-classic fa-solid fa-xmark"></i>
                </button>

                <h2
                    id="modal-title"
                    class="text-2xl font-bold mb-4 text-gray-800 text-center"
                ></h2>

                <img
                    id="modal-img"
                    class="w-full h-48 object-cover rounded-md mb-4 shadow-sm"
                    src=""
                    alt="Recipe Image"
                />

                <div class="overflow-y-auto w-full text-left px-2">
                    <p
                        id="modal-instructions"
                        class="text-gray-600 leading-relaxed"
                    ></p>
                </div>
            </div>
        </div>
        <!-- Scripts -->
        <script src="./assets/js/app.js"></script>
    </body>
</html>
