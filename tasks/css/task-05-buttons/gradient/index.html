<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Colorful Gradient Buttons</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="wrap">
            <div class="btn-grid">
                <!-- Row 1 -->
                <button class="btn g-1">Read More</button>
                <button class="btn g-2">Read More</button>
                <button class="btn g-3">Read More</button>
                <button class="btn g-4">Read More</button>
                <button class="btn g-5">Read More</button>

                <!-- Row 2 -->
                <button class="btn g-6">Read More</button>
                <button class="btn g-7">Read More</button>
                <button class="btn g-8">Read More</button>
                <button class="btn g-9">Read More</button>
                <button class="btn g-10">Read More</button>

                <!-- Row 3 -->
                <button class="btn g-11">Read More</button>
                <button class="btn g-12">Read More</button>
                <button class="btn g-13">Read More</button>
                <button class="btn g-14">Read More</button>
                <button class="btn g-15">Read More</button>

                <!-- Row 4 (center single neutral) -->
                <div class="spacer"></div>
                <button class="btn neutral">Read More</button>
                <div class="spacer"></div>
            </div>
        </main>
    </body>
</html>
